# Receives a jaen publish.
#
# The CMS (gatsby-plugin-jaen, `remote.repository` in gatsby-config.ts) sends a
# repository_dispatch with the URL of the delta it wrote, and this appends that
# URL to jaen-data/patches.txt on main, which is the branch the site is built
# from. Nothing else: the build cannot run here, because the jaen packages are
# `link:` dependencies on a sibling checkout the runner does not have
# (okf/operations/deploy.md). The deploy stays `scripts/deploy.sh`, run after
# a pull.
#
# Until 2026-09-05 this pushed with --force to a main that was not the branch
# the site was built from, and then called a reusable deploy workflow that
# failed on every run since 2025-11.

name: Publish

on:
  repository_dispatch:
    types: [UPDATE_JAEN_RESOURCE]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    if: ${{ github.event.client_payload.migrationURL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Append the delta to the chain
        env:
          MIGRATION_URL: ${{ github.event.client_payload.migrationURL }}
        run: |
          set -euo pipefail
          case "$MIGRATION_URL" in
            https://osg.snek.at/storage/*|https://osg.netsnek.com/storage/*) ;;
            *) echo "refusing a migration URL outside the storage gateway: $MIGRATION_URL" >&2; exit 1 ;;
          esac
          if grep -qxF "$MIGRATION_URL" jaen-data/patches.txt; then
            echo "already in the chain, nothing to do"
            exit 0
          fi
          printf '%s\n' "$MIGRATION_URL" >> jaen-data/patches.txt
          git config user.name "jaen publish"
          git config user.email "noreply.snek.at@gmail.com"
          git add jaen-data/patches.txt
          git commit -m "jaen-publish: migrate jaen-data"
          # Another publish may have landed since the checkout; replay on top
          # of it rather than overwriting it.
          git pull --rebase origin main
          git push origin main
