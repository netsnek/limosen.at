# The Actions deploy of limosen.at, and where its storage credential is named.
#
# This workflow does not run on a push, and that is deliberate. The build
# cannot happen on a runner today: the jaen packages are `link:` dependencies
# on a sibling checkout the runner does not have, so what actually ships is
# `scripts/deploy.sh` on the maintainer's machine (okf/operations/deploy.md),
# and the reusable workflow called below has failed on every run since 2025-11
# in the sibling repository that still calls it.
#
# It exists so this site's build has one place that names OSG_TOKEN. The
# storage gateway is private: gatsby-source-jaen fetches every media file the
# jaen data names with that token and writes the files into the site's own
# output, so the published site never asks the gateway for anything. A build
# without the token stops on the first media node with a message naming it,
# rather than shipping blank images. See jaen
# docs/architecture/private-storage.md, "The build".

name: Deploy

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    uses: atsnek/jaen/.github/workflows/jaen-deploy.yaml@main
    with:
      CLOUDFLARE_PROJECT_NAME: 'limosen'
    secrets:
      # OSG_TOKEN IS NOT PASSED HERE, and that is the fix rather than an
      # omission. `atsnek/jaen/.github/workflows/jaen-deploy.yaml@main` does
      # not declare OSG_TOKEN under `on.workflow_call.secrets`, and a caller
      # that maps a secret the callee never declared is a `startup_failure`:
      # the run ends before a job starts, so the site does not deploy and no
      # log says why. Measured on every Deploy run of this repository between
      # 2026-09-07T20:39 and the commit that removed this line.
      #
      # The build's storage credential lives on as the repository secret
      # OSG_TOKEN (the machine user of this site's organisation, holding
      # storage:read). What is missing is on the other side: the reusable
      # workflow has to declare OSG_TOKEN and export it into the Gatsby build
      # step beside SENTRY_AUTH_TOKEN. Until it does, the build that ships is
      # `scripts/deploy.sh` on the maintainer's machine, which reads the token
      # from ~/.config/jaen/osg-<brand>.env. See jaen
      # docs/architecture/private-storage.md, "The build".
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
